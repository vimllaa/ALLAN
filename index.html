<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.L.L.A.N. Forskningsterminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Scenen är alltid 1024×600 "inuti" och skalas av app.js så att den fyller fönstret. -->
  <div id="stage">

    <!-- Täckpaneler över det som är inbakat i bilden -->
    <div class="cover" id="cover-nav"></div>
    <div class="cover" id="cover-clock"></div>
    <div class="cover" id="cover-status"></div>

    <!-- Toppmenyn (ersätter bildens OBSERVE · ANALYSE · CONNECT · DISCOVER) -->
    <nav id="topnav">
      <span data-nav="archive">ARKIV</span><i>/</i>
      <span data-nav="observation">OBSERVATION</span><i>/</i>
      <span data-nav="audio">LJUD</span><i>/</i>
      <span data-nav="experiments">EXPERIMENT</span><i>/</i>
      <span data-nav="reports">RAPPORTER</span>
    </nav>

    <!-- Levande datum och klocka -->
    <div id="clock"><div id="clock-date"></div><div id="clock-time"></div></div>

    <!-- SUBJECT COHORT / STATUS -->
    <div id="status">
      <div><b>PULS</b><u></u><span id="st-hr"></span></div>
      <div><b>TEMP</b><u></u><span id="st-temp"></span></div>
      <div><b>AKT</b><u></u><span id="st-act"></span></div>
      <div><b>GLU</b><u></u><span id="st-glu"></span></div>
      <div><b>LÄGE</b><u></u><span id="st-state"></span></div>
    </div>

    <!-- Stora mittenpanelen -->
    <main id="main">
      <header><h1 id="main-title"></h1><span id="main-tag"></span></header>
      <div id="main-body"></div>
      <footer id="main-pager"></footer>
    </main>

    <!-- DR. PIP / OBSERVATION LOG: Dr. Pips logg, fem rader -->
    <div id="notes">
      <div></div><div></div><div></div><div></div><div></div>
    </div>

    <!-- Dr. Pips fluga och hatt på porträttet, syns bara i balkapitlet -->
    <div id="pip-frack"><i class="hat"></i><i class="bow"></i></div>

    <!-- Bandet under mittenpanelen -->
    <div id="hints"></div>
    <div id="band-left"></div>
    <div id="band-right"></div>

    <!-- Förstorad bild i Archive (tangenten A på en bild) -->
    <div id="zoom" hidden></div>

    <!-- Varningsruta före hemligstämplade dokument i Archive -->
    <div id="alert" hidden></div>

    <!-- Felsökningsruta (tangenten D) -->
    <pre id="debug" hidden></pre>
  </div>

  <script src="js/content.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/specimen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
